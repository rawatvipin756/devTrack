<!DOCTYPE html>
<html lang="en">
<head>

    <title>DevTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <header>

            </section>
            <section id="allTasks"></section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
