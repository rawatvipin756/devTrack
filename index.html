<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTrack</title>
    <link rel="stylesheet" href="./src/output.css">
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
    <div class="mx-auto max-w-6xl px-5 py-8">
        <header>
            <h1 class="text-4xl font-bold text-slate-800">DevTrack</h1>
            <p class="text-slate-500 mt-2 ">Developer Productivity Dashboard</p>
        </header>
        <main>
            <section id="dashBoard" class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
                <div class="border-2 w-">
                    <h3>Total tasks</h3>
                    <p id="totalTask" class="text-center">0</p>
                </div>
                <div>
                    <h3>Completed</h3>
                    <p id="compTask">0</p>
                </div>
                <div>
                    <h3>Pending</h3>
                    <p id="pendingTask">0</p>
                </div>
            </section>
            <section id="formSection">
                <form id="taskForm">
                    <input id="inputTask" placeholder="Enter Task" class="border-2">
                    <select id="selectOpt">
                        <option>Select your options</option>
                        <option value="DSA">DSA</option>
                        <option value="Javascript">Javascript</option>
                        <option value="C++">C++</option>
                        <option value="Projects">Projects</option>
                        <option value="Other">Other</option>
                    </select>
                    <button type="submit" id="addBtn">ADD</button>
                </form>
            </section>
            <section id="allTasks"></section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
