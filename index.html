<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTrack</title>
    <link rel="stylesheet" href="./src/output.css">
</head>
<body class="bg-slate-100 min-h-screen">
    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="mb-8">
            <h1 class="text-4xl font-black text-slate-800">DevTrack</h1>
            <p class="mt-2 text-slate-500">Developer Productivity Dashboard</p>
        </header>
        <main>
            <section id="dashBoard" class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <h3 class="text-sm font-medium text-slate-500">Total tasks</h3>
                    <p id="totalTask" class="text-3xl font-bold test-slate-800 mt-2">0</p>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <h3 class="text-sm font-medium text-slate-500">Completed</h3>
                    <p id="compTask" class="text-3xl font-bold text-green-600 mt-2">0</p>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <h3 class="text-sm font-medium text-slate-500">Pending</h3>
                    <p id="pendingTask" class="text-3xl font-bold text-orange-500 mt-2">0</p>
                </div>
            </section>
            <section id="formSection" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-8">
                <h2 class="text-xl font-semibold text-slate-800 mb-4">Add Learning Goal</h2>
                <form id="taskForm" class="flex flex-col md:flex-row gap-3">
                    <input id="inputTask" placeholder="Enter Task" class="flex-1 border border-slate-300 rounded-lg px-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <select id="selectOpt" class="border border-slate-300 rounded-xl px-4 py-2.5 bg-white outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="" disabled selected>Select your options</option>
                        <option value="DSA">DSA</option>
                        <option value="Javascript">Javascript</option>
                        <option value="C++">C++</option>
                        <option value="Projects">Projects</option>
                        <option value="Other">Other</option>
                    </select>
                    <button type="submit" id="addBtn" class="bg-blue-600 text-white font-medium px-6 py-2.5 rounded-lg hover:bg-blue-700 transition ">ADD</button>
                </form>
            </section>
            <section id="allTasks" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5"></section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
